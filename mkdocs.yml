site_name: MLOps Project
theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.ico
  features:
      - content.code.copy

extra_css:
  - overrides/main.css

nav:
  - 📖 &nbsp;Introduction : index.md
  - 🛠️ &nbsp;Installation & Setup : installation_setup.md
  - 👤 &nbsp;User Guide : user_guide.md
  # - 💻 &nbsp;Developer Documentation : developer_documentation.md
  - 🚀 &nbsp;Next Steps : next_steps.md

markdown_extensions:
  - attr_list
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.highlight
  - pymdownx.tasklist
  - pymdownx.emoji
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.details
  - pymdownx.keys
  - md_in_html
  - pymdownx.betterem
  - pymdownx.inlinehilite
  - pymdownx.magiclink
  - pymdownx.snippets
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.extra
  - pymdownx.highlight
  - md_in_html
  - footnotes
  - tables
  - admonition
  - toc:
      permalink: true
